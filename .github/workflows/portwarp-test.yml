
name: NOVA PortWarp Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install PortWarp
        run: |
          curl -fsSL https://portwarp.com/download/install.sh | bash
          pwrp version
          pwrp doctor

      - name: Start TCP Test Server
        run: |
          cat > server.py <<'PY'
          import socketserver

          class Handler(socketserver.BaseRequestHandler):
              def handle(self):
                  self.request.sendall(
                      b"NOVA PORTWARP TEST OK\n"
                  )
                  while True:
                      data = self.request.recv(1024)
                      if not data:
                          break
                      self.request.sendall(data)

          server = socketserver.ThreadingTCPServer(
              ("127.0.0.1", 3389), Handler
          )
          server.serve_forever()
          PY

          nohup python3 server.py >/tmp/server.log 2>&1 &
          sleep 3

          python3 -c "import socket; s=socket.create_connection(('127.0.0.1',3389)); print(s.recv(100).decode()); s.close()"

      - name: PortWarp Login
        run: |
          pwrp login

      - name: Check Tunnel
        run: |
          pwrp status
          pwrp tunnels

      - name: Connect NOVA Tunnel
        run: |
          pwrp connect "NOVA-RDP-Test" --detach
          pwrp ps --once

      - name: Keep Tunnel Alive
        run: |
          while true; do
            echo "NOVA PortWarp is running"
            pwrp ps --once
            sleep 60
          done
          
